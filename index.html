<div id="start-screen" class="screen-overlay">
    <div class="start-content">
        <h1 class="logo"><img style="fill:#ffffff;" src="assets/logo.svg" />
        </h1>

        <!-- Navigation Options -->
        <div class="start-menu">
            <div class="sprite-select" role="radiogroup" aria-label="Choose your sprite">
                <label class="sprite-choice-btn">
                    <input type="radio" name="playerSprite" value="A" checked onchange="setPlayerSprite('A')" />
                    <img src="assets/player-a.svg" alt="Puni Puni A" />
                    <span>Sprite A</span>
                </label>
                <label class="sprite-choice-btn">
                    <input type="radio" name="playerSprite" value="B" onchange="setPlayerSprite('B')" />
                    <img src="assets/player-b.svg" alt="Puni Puni B" />
                    <span>Sprite B</span>
                </label>
            </div>
            <button id="btn-start" onclick="startGame()">Start Game</button>
            <button id="btn-leaderboard" onclick="toggleLeaderboard()">Leaderboard</button>
        </div>

        <!-- Language Selector -->
        <div class="start-lang-select">
            <button onclick="setLang('ENG')">English</button>
            <button onclick="setLang('JPN')">日本語</button>
        </div>



        <div class="tooltip-container" id="tooltip" onclick="this.classList.toggle('active')">
            ?
            <span id="tooltip-label" class="tooltip-text">Escape from Tarkov is a registered trademark of Battlestate
                Games. This project is not affiliated with, endorsed by, or sponsored by the developer.</span>
        </div>

        <div id="leaderboard-box" style="display: none;">
            <div style="display:flex; gap: 10px;">
                <h3 id="highscores" style="flex:auto;">Global High Scores</h3><button id="closebtn-label2"
                    style="width: 100px; height: 35px; line-height: 10px;" onclick="toggleLeaderboard()">Close</button>
            </div>
            <ol id="leaderboard-list">Loading scores...</ol>
        </div>
    </div>
</div>
